<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retargeteador de skins</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#1d2129;--muted:#69707d;--line:#e2e5ea;--accent:#2563eb;--accent-soft:#e8efff;--ok:#15803d;--err:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--panel:#1b1e23;--text:#e6e8eb;--muted:#9aa1ad;--line:#2c3038;--accent:#6b9bff;--accent-soft:#1e2a44;--ok:#4ade80;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
header .meta{color:var(--muted);font-size:13px}
header .spacer{flex:1}
select,input[type=text],input[type=search]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:8px 18px}
button:disabled{opacity:.5;cursor:not-allowed}
main{display:grid;grid-template-columns:220px 1fr 1fr;gap:12px;padding:12px 20px;height:calc(100vh - 170px);min-height:420px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0;padding:10px 12px 6px}
.col .filter{margin:0 12px 8px}
.list{overflow:auto;flex:1;padding:0 6px 8px}
.item{padding:5px 8px;border-radius:5px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.item:hover{background:var(--bg)}
.item.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.item .slot{font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.2em;text-align:right;font-size:12px}
.item.chroma{padding-left:26px}
.group{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 8px 3px}
footer{padding:0 20px 16px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .summary{flex:1;min-width:260px}
.bar .summary b{font-weight:600}
.bar input[type=text]{width:100%;margin-top:6px}
.msg{margin-top:8px;font-size:13px;white-space:pre-wrap}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.hint{color:var(--muted);font-size:12px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted)}
@media (max-width:860px){main{grid-template-columns:1fr;height:auto}.col{height:320px}}
</style>
</head>
<body>
<header>
  <h1>Retargeteador de skins</h1>
  <span class="meta" id="patch"></span>
  <span class="spacer"></span>
  <label class="meta">Rama
    <select id="branch"></select>
  </label>
  <button id="openOut" title="Abrir carpeta retargets">Abrir carpeta</button>
</header>
<main>
  <section class="col">
    <h2>Campeón</h2>
    <input class="filter" type="search" id="fChamp" placeholder="Buscar…">
    <div class="list" id="champs"></div>
  </section>
  <section class="col">
    <h2>Skin a usar (origen)</h2>
    <input class="filter" type="search" id="fSrc" placeholder="Filtrar…">
    <div class="list" id="sources"><div class="hint" style="padding:8px">Elegí un campeón.</div></div>
  </section>
  <section class="col">
    <h2>Slot a reemplazar (destino)</h2>
    <input class="filter" type="search" id="fDst" placeholder="Filtrar…">
    <div class="list" id="targets"></div>
  </section>
</main>
<footer>
  <div class="bar">
    <div class="summary">
      <div id="summary" class="hint">Elegí origen y destino.</div>
      <input type="text" id="fname" placeholder="Nombre del archivo (opcional)">
    </div>
    <label class="chk"><input type="checkbox" id="commit" checked> Commit en la rama</label>
    <button class="primary" id="go" disabled>Generar</button>
  </div>
  <div id="msg" class="msg"></div>
</footer>
<script>
const $ = s => document.querySelector(s);
const S = {champs: [], champ: null, data: null, src: null, dst: null};
const api = async (path, body) => {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg = (t, cls='') => { const m = $('#msg'); m.textContent = t; m.className = 'msg ' + cls; };
const remember = (k, v) => { try { localStorage.setItem('rt_' + k, v); } catch (e) {} };
const recall = k => { try { return localStorage.getItem('rt_' + k); } catch (e) { return null; } };

function renderState(st) {
  $('#patch').textContent = 'índice ' + (st.patch || '?');
  const b = $('#branch');
  b.innerHTML = st.branches.map(x => `<option ${x === st.branch ? 'selected' : ''}>${esc(x)}</option>`).join('');
  S.champs = st.champions;
  renderChamps();
}
function renderChamps() {
  const f = $('#fChamp').value.toLowerCase();
  $('#champs').innerHTML = S.champs.filter(c => c.toLowerCase().includes(f))
    .map(c => `<div class="item ${c === S.champ ? 'sel' : ''}" data-c="${esc(c)}">${esc(c)}</div>`).join('');
}
function renderSources() {
  if (!S.data) return;
  const f = $('#fSrc').value.toLowerCase(); let g = null, h = '';
  for (const s of S.data.sources) {
    if (f && !s.label.toLowerCase().includes(f)) continue;
    if (s.group !== g) { g = s.group; h += `<div class="group">${esc(g)}</div>`; }
    h += `<div class="item ${s.path === S.src?.path ? 'sel' : ''}" data-p="${esc(s.path)}">${esc(s.label)}</div>`;
  }
  $('#sources').innerHTML = h || '<div class="hint" style="padding:8px">Sin archivos para este campeón.</div>';
}
function renderTargets() {
  if (!S.data) return;
  const f = $('#fDst').value.toLowerCase();
  $('#targets').innerHTML = S.data.targets.filter(t => !f || t.label.toLowerCase().includes(f) || String(t.slot) === f)
    .map(t => `<div class="item ${t.kind} ${t.slot === S.dst?.slot ? 'sel' : ''}" data-s="${t.slot}"><span class="slot">${t.slot}</span><span>${esc(t.label)}</span></div>`).join('');
}
function updateSummary() {
  const ok = S.src && S.dst;
  $('#go').disabled = !ok;
  $('#summary').innerHTML = ok
    ? `<b>${esc(S.src.label)}</b> → slot <b>${S.dst.slot}</b> (${esc(S.dst.label)})<br><span class="hint">En champ select elegí <b>${esc(S.dst.label)}</b>${S.dst.kind === 'chroma' ? ' (con la chroma)' : ''}. Desactivá otros mods de ${esc(S.champ)}.</span>`
    : 'Elegí origen y destino.';
}
async function pickChamp(c) {
  S.champ = c; S.src = null; S.dst = null; remember('champ', c);
  renderChamps(); msg('');
  S.data = await api('/api/champ?name=' + encodeURIComponent(c));
  renderSources(); renderTargets(); updateSummary();
}
$('#champs').onclick = e => { const it = e.target.closest('.item'); if (it) pickChamp(it.dataset.c).catch(err => msg(err.message, 'err')); };
$('#sources').onclick = e => { const it = e.target.closest('.item'); if (!it) return; S.src = S.data.sources.find(s => s.path === it.dataset.p); renderSources(); updateSummary(); };
$('#targets').onclick = e => { const it = e.target.closest('.item'); if (!it) return; S.dst = S.data.targets.find(t => t.slot === +it.dataset.s); renderTargets(); updateSummary(); };
$('#fChamp').oninput = renderChamps; $('#fSrc').oninput = renderSources; $('#fDst').oninput = renderTargets;
$('#commit').onchange = e => remember('commit', e.target.checked ? '1' : '0');
$('#go').onclick = async () => {
  $('#go').disabled = true; msg('Generando…');
  try {
    const r = await api('/api/retarget', {champion: S.champ, source: S.src.path, slot: S.dst.slot, filename: $('#fname').value.trim() || null, commit: $('#commit').checked});
    let t = `Listo: ${r.output}  (skin${r.from} → skin${r.to})`;
    if (r.commit) t += r.commit.ok ? '\nCommit hecho.' : '\nNo se pudo commitear: ' + r.commit.output;
    msg(t, r.commit && !r.commit.ok ? 'err' : 'ok');
    $('#fname').value = '';
    S.data = await api('/api/champ?name=' + encodeURIComponent(S.champ)); renderSources();
  } catch (err) { msg(err.message, 'err'); }
  $('#go').disabled = false;
};
$('#branch').onchange = async e => {
  msg('Cambiando de rama…');
  try { const r = await api('/api/switch', {branch: e.target.value}); renderState(r); msg(r.ok ? 'Rama: ' + r.branch : r.output, r.ok ? 'ok' : 'err'); if (S.champ) await pickChamp(S.champ); }
  catch (err) { msg(err.message, 'err'); }
};
$('#openOut').onclick = () => api('/api/open', {path: S.champ ? 'retargets/' + S.champ : null}).catch(err => msg(err.message, 'err'));
(async () => {
  try {
    if (recall('commit') === '0') $('#commit').checked = false;
    renderState(await api('/api/state'));
    const c = recall('champ'); if (c && S.champs.includes(c)) await pickChamp(c);
  } catch (err) { msg(err.message, 'err'); }
})();
</script>
</body>
</html>
